[project]
name = "dataagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satyam Chaturvedi", email = "ssatyamsharma5678@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
]

[project.scripts]
dataagent = "dataagent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
